[package]
name = "manasphere-scryfall"
version = "0.1.0"
description = "Fetches and parses Scryfall's bulk card data."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-compression = { version = "0.4.44", features = ["gzip", "tokio"] }
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1.26.0", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
