[package]
name = "manasphere-core"
version = "0.1.0"
description = "Shared record types and database models for Manasphere."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
manasphere-scryfall = { version = "0.1.0", path = "../scryfall" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
sqlx = "0.9.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }
