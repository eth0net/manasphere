# Advisories, licences, duplicate versions and crate sources.
#
#     cargo deny check

[advisories]
# Waiving one needs a reason and a link here, not silence.
ignore = []

[licenses]
# Exactly what the tree uses, nothing on spec — an unmatched entry is an error
# under --deny warnings. Add each licence as a dependency brings it in, and
# treat that as a licensing decision: AGPL-3.0-only can link permissive code,
# not the reverse.
# Each of these is the *only* option some crate offers. Dual-licensed crates
# (r-efi's LGPL, memchr's Unlicense, miniz_oxide's Zlib) resolve against MIT or
# Apache-2.0 and need no entry.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",  # webpki-root-certs — a data licence, for a data crate
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",  # foldhash, under sqlx
]

# Our own crates are publish = false and AGPL by definition; this check is
# about what we pull in.
private = { ignore = true }

[bans]
# A duplicate should be argued for, not accumulated one transitive bump at a
# time. If two versions must coexist, add a skip saying what would remove it.
multiple-versions = "deny"
wildcards = "deny"
# Our own path dependencies carry no version, because nothing here is published
# and a version on a path dep is just another number to keep in sync. Registry
# wildcards are still refused.
allow-wildcard-paths = true
skip = [
  # macOS only. hyper-util pulls system-configuration 0.7, rustls-platform-verifier
  # pulls security-framework 3.7, and they disagree. Gone when either bumps.
  { crate = "core-foundation@0.9" },
  # The icu chain under url is mid-migration: displaydoc is on syn 3, yoke-derive
  # still on syn 2. Gone when synstructure releases against syn 3.
  { crate = "syn@2" },
  # sqlx's hashlink is a minor behind indexmap's. Gone when hashlink bumps.
  { crate = "hashbrown@0.16" },
]

[sources]
# A git or alternate-registry dependency means no yanking and no advisory
# coverage, so it should be deliberate rather than arrive in a lockfile.
unknown-registry = "deny"
unknown-git = "deny"
